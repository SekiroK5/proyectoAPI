# Configuracion externa opcional (no se versiona): .env y llaves de GestoPago locales
spring.config.import=optional:file:./config/gestopago.properties,optional:file:./.env[.properties]


# ========================
# Base de datos PostgreSQL
# ========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/practica1_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.open-in-view=false

# ========================
# Jackson (No responder campos nulos y parseo exacto de BigDecimal)
# ========================
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.use-big-decimal-for-floats=true
# Permite recibir enums sin distinguir mayusculas (ej. "soltero" -> SOLTERO)
spring.jackson.mapper.accept-case-insensitive-enums=true


# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# ========================
# GestoPago - Feign Client (Servidor Real)
# ========================
gestopago.auth.url=https://gestopago.portalventas.net

# GestoPago - Credenciales de prueba publicadas en la documentacion de PuntoRed (se pueden sobrescribir con variables de entorno)
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:83}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:GPS83-TPV-17}
gestopago.auth.password=${GESTOPAGO_PASSWORD:12345678}
# Cada hora se revisa si el token vencio; solo se pide uno nuevo cada 23 h (PuntoRed permite uno al dia)
gestopago.auth.refresh-rate-ms=3600000
gestopago.auth.vigencia-horas=23

# ========================
# GestoPago - Transacciones (sendTx / confirmTx)
# ========================
gestopago.tx.url=${gestopago.auth.url}
# Llave (SECRET_KEY) e IV de cifrado AES que entrega PuntoRed. No se escriben aqui: se toman de las
# variables de entorno GESTOPAGO_SECRET_KEY y GESTOPAGO_IV, o de config/gestopago.properties (fuera de Git).
# Sin ellas la API arranca, pero los pagos responden 503 sin hacer ningun cargo.
gestopago.cifrado.llave=${GESTOPAGO_SECRET_KEY:}
gestopago.cifrado.iv=${GESTOPAGO_IV:}
# Encabezado X-API-Key: solo si PuntoRed asigno uno
gestopago.api-key=${GESTOPAGO_API_KEY:}
# Unidad comercial o sucursal (3 a 25 caracteres)
gestopago.tx.unidad=${GESTOPAGO_UNIDAD:083}
# Zona horaria del campo horaLocal (yyyyMMddHHmmss)
gestopago.tx.zona-horaria=America/Mexico_City
# Cada cuanto se confirman con confirmTx las transacciones sin respuesta
gestopago.tx.confirmacion-ms=60000
# GestoPago espera hasta 62 s antes de responder codigo 82: el timeout de lectura debe ser mayor
spring.cloud.openfeign.client.config.gestoPagoTx.connect-timeout=10000
spring.cloud.openfeign.client.config.gestoPagoTx.read-timeout=70000

# ========================
# Servidor
# ========================
# Railway (y otros PaaS) asignan el puerto en la variable PORT; en local se usa 8081
server.port=${PORT:8081}
# Detras del proxy HTTPS de Railway: respeta X-Forwarded-Proto/Host para que Swagger use la URL publica
server.forward-headers-strategy=framework

# ========================
# Servicio Productos (PuntoRed - SERVIDOR EXTERNO REAL)
# ========================
productos.service.url=${gestopago.auth.url}
productos.service.id-distribuidor=${gestopago.auth.id-distribuidor}
productos.service.codigo-dispositivo=${gestopago.auth.codigo-dispositivo}
# Cron: ejecutar 1 vez al dia a las 6am (max 3 llamadas/dia segun documentacion PuntoRed)
productos.service.cron=0 0 6 * * *

# ========================
# Onboarding de clientes
# ========================
# Saldo inicial asignado por el sistema a cada cuenta nueva (no puede ser negativo)
onboarding.cuenta.saldo-inicial=${SALDO_INICIAL_CUENTA:0.00}
# Monto maximo por cada deposito a la cuenta propia (POST /api/v1/cuentas/deposito)
onboarding.deposito.monto-maximo=${DEPOSITO_MONTO_MAXIMO:50000.00}

# ========================
# Inicio de sesion (JWT + A2F TOTP)
# ========================
# Secreto HS256 de al menos 32 caracteres. El valor por defecto es solo para desarrollo local:
# en cualquier otro ambiente defina JWT_SECRETO.
seguridad.jwt.secreto=${JWT_SECRETO:desarrollo-local-cambiar-este-secreto-jwt-0123456789}
seguridad.jwt.emisor=productosList
seguridad.jwt.expiracion-minutos=30
# Token temporal entre la contrasena y el codigo A2F
seguridad.a2f.expiracion-minutos=5
# Nombre que muestra la app autenticadora
seguridad.a2f.emisor=productosList
# Bloqueo temporal tras intentos fallidos (contrasena o codigo A2F)
seguridad.login.max-intentos=5
seguridad.login.bloqueo-minutos=15

# ========================
# Errores por defecto de Spring (los que no atiende GlobalExceptionHandler)
# Nunca exponer trazas, excepciones ni mensajes internos al cliente
# ========================
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
