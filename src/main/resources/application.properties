# ========================
# Spring Cloud Config
# ========================
spring.cloud.config.enabled=false

# ========================
# Base de datos PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/practica1_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ========================
# JPA / Hibernate
# ========================
spring.jpa.open-in-view=false

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

# ========================
# GestoPago - Feign Client
# ========================
gestopago.auth.url=localhost:8080

# GestoPago - Credenciales (ajustar con los valores reales del profesor)
gestopago.auth.id-distribuidor=1
gestopago.auth.codigo-dispositivo=DISPOSITIVO_001
gestopago.auth.password=password_gestopago
gestopago.auth.refresh-rate-ms=3600000

# ========================
# Servidor
# ========================
server.port=8081

# ========================
# Servicio Productos (PuntoRed)
# ========================
productos.service.url=https://gestopago.portalventas.net
productos.service.id-distribuidor=1
productos.service.codigo-dispositivo=DISPOSITIVO_001
# Cron: ejecutar 1 vez al dia a las 6am (max 3 llamadas/dia segun documentacion PuntoRed)
productos.service.cron=0 0 6 * * *
