plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.springframework.boot' version '3.3.6'//Versión de componentes de spring boot
    id 'org.sonarqube' version '4.0.0.2929'
    id "org.owasp.dependencycheck" version "8.1.2"
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group 'com.proyecto.servicio.empresa'
version '1.0'

java{
    sourceCompatibility=17
    targetCompatibility=17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}


dependencies {
    //Spring Framework
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //Seguridad: inicio de sesion con JWT (HS256) y segundo factor TOTP
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'commons-codec:commons-codec' // Base32 del secreto TOTP
    //Documentation y APIs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0' // 2.6.x es la linea compatible con Spring Boot 3.3
    //Bases de datos (Hibernate y HikariCP llegan con spring-boot-starter-data-jpa)
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    //Mapeo DTO <-> entidad
    implementation 'org.mapstruct:mapstruct:1.6.3'
    //XML (respuesta de PuntoRed getProductList)
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.3'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Servidor HTTP simulado de GestoPago para las pruebas de integracion (version shaded: no choca con Jetty/Jackson de Boot)
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


configurations.all {
    exclude group: "org.apache.logging.log4j", module: "log4j-api"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "log4j", module: "log4j"
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    finalizedBy jacocoTestReport
}

springBoot {
    buildInfo {
    }
}

sonarqube {
    properties {
        property "sonar.exclusions", "**/App.java,**/model/**,**/entity/**,**/enums/**,**/config/**,**/controller/**,**/service/configuracion/**"
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

dependencyCheck {
    formats = ["JSON", "HTML"]
}
